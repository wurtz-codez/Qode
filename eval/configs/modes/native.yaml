# Native mode — Qode tools only, no grep enrichment
#
# Explicit tools: qode-query, qode-context, qode-impact, qode-cypher
# Available as fast bash commands (~100ms via eval-server)
#
# Use this mode to isolate the value of explicit tools without grep augmentation.
agent:
  agent_class: "eval.agents.qode_agent.QodeAgent"
  qode_mode: "native"
  step_limit: 30
  cost_limit: 3.0
  track_qode_usage: true

environment:
  environment_class: "eval.environments.qode_docker.QodeDockerEnvironment"
  enable_qode: true
  skip_embeddings: true
  qode_timeout: 120
  eval_server_port: 4848
