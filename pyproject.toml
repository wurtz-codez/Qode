[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qode"
version = "0.1.0"
description = "Local-first, multi-agent code archaeology and intelligence system"
authors = [{ name = "Koustubh Pande" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["code-analysis", "knowledge-graph", "multi-agent", "security", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # CLI
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    # Parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    # Database
    "kuzu>=0.7.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    # Agent orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # LLM providers
    "google-generativeai>=0.8.0",
    "openai>=1.50.0",
    "ollama>=0.3.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "websockets>=13.0",
    # Data / utilities
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "tomli>=2.1.0; python_version < '3.11'",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "pathspec>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "pyright>=1.1.385",
    "pre-commit>=3.5.0",
    "pip-audit>=2.7.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
qode = "qode.cli.main:app"

[project.urls]
Homepage = "https://github.com/koustubhpande/qode"
Repository = "https://github.com/koustubhpande/qode"
Documentation = "https://github.com/koustubhpande/qode/blob/main/docs/architecture.md"

# ---------------------------------------------------------------------------
# Hatchling build
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/qode"]

# ---------------------------------------------------------------------------
# Ruff — linting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py39"
line-length = 88
src = ["src"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "FBT", # flake8-boolean-trap
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type annotation for self in method
    "ANN401",  # allow Any in rare cases
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"scripts/**/*.py" = ["ANN"]
# Typer CLI: bool params are idiomatic, not a trap
"src/qode/cli/**/*.py" = ["FBT001", "FBT002", "FBT003"]

# ---------------------------------------------------------------------------
# Ruff — formatting (mirrors Black)
# ---------------------------------------------------------------------------
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ---------------------------------------------------------------------------
# Black — formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  frontend
  | \.venv
)/
'''

# ---------------------------------------------------------------------------
# isort — import sorting
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
src_paths = ["src"]
skip_glob = ["frontend/**"]

# ---------------------------------------------------------------------------
# Pyright — type checking
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.9"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["frontend", "scripts"]
extraPaths = ["src"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/qode --cov-report=term-missing --cov-fail-under=0"

[tool.coverage.run]
source = ["src/qode"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
